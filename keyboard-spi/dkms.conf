PACKAGE_NAME="macbook12-spi"
PACKAGE_VERSION="0.1"

# Patched spi-pxa2xx-pci: saves/restores the Intel LPSS private register
# context (BAR0+0x800) across S3 so the MacBook 12" keyboard/touchpad
# (applespi) survive suspend. See README.md.
MAKE[0]="make KVER=$kernelver"
CLEAN="make KVER=$kernelver clean"

BUILT_MODULE_NAME[0]="spi-pxa2xx-pci"
DEST_MODULE_LOCATION[0]="/kernel/extra"

AUTOINSTALL="yes"
